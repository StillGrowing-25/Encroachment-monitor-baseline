<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Land Encroachment Monitor{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>.leaflet-container { font: 12px/1.4 system-ui; }</style>
</head>
<body>
<header class="topbar">
  <div class="brand">🛰️ Government-Land Encroachment Monitor</div>
  {% if user %}
  <nav>
    <a href="{{ url_for('map_view') }}" {% if request.endpoint=='map_view' %}class="active"{% endif %}>Map</a>
    <a href="{{ url_for('alerts_view') }}" {% if request.endpoint=='alerts_view' %}class="active"{% endif %}>Alerts</a>
    <a href="{{ url_for('report_view') }}" {% if request.endpoint=='report_view' %}class="active"{% endif %}>Report</a>
    {% if user.role == 'admin' %}<a href="{{ url_for('audit_view') }}" {% if request.endpoint=='audit_view' %}class="active"{% endif %}>Audit</a>{% endif %}
  </nav>
  <div class="who">
    <span class="role role-{{ user.role }}">{{ user.role }}</span> {{ user.username }}
    <a class="btn btn-ghost" href="{{ url_for('logout') }}">Log out</a>
  </div>
  {% endif %}
</header>
<main>
{% block content %}{% endblock %}
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
